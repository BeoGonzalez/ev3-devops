version: "3.8"
services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./devops_config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - ""
    restart: always
    networks:
      -

  loki:
    image: grafana/loki:2.8.2
    container_name: loki
    ports:
      - ""
    volumes:
      - ./devops_config/ :/etc/loki/local-config.yaml:ro
      - ./loki_data:/loki # volumen para index/chunks
      - ./wal_data:/wal # volumen para WAL
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      -
  promtail:
    image: grafana/promtail:2.8.2
    container_name: promtail
    volumes:
      - ./devops_config/promtail-config.yml:/etc/promtail/config.yml:ro
      # montamos el directorio de logs de la app para que promtail lo lea
      - ./logs:/usr/src/app/logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      -

  grafana:
    image: grafana/grafana:9.5.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - loki
    networks:
      -
  back:
    image:
    container_name: back
    ports:
      - "3001:3001"
    volumes:
      - ./logs:/usr/src/app/logs
    networks:
      -

networks:
  devops:
volumes:
  prometheus_data:
